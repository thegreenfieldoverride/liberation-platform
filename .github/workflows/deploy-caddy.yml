name: 🔀 Deploy Caddy Config

# Manual dispatch only, like every other infrastructure gate.
#
# This file fronts every public domain on the box — the platform, staging,
# analytics, strategist. A syntax error takes all of them down at once, so
# this workflow validates twice (locally, then on the server), keeps a dated
# backup, and rolls back automatically if the reload does not result in a
# working site.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm — this affects every domain'
        required: true
        default: ''
        type: string
      skip_smoke_test:
        description: 'Skip post-reload smoke test (not recommended)'
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: ✅ Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirmation gate
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::Confirmation not given. Type DEPLOY to proceed."
            exit 1
          fi

      - name: Validate syntax with Caddy
        run: |
          docker run --rm -v "$PWD/infrastructure/caddy:/etc/caddy:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "✅ Caddyfile is syntactically valid"

  deploy:
    name: 🔀 Deploy to server
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Push config, preflight, reload with rollback
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          SKIP_SMOKE: ${{ github.event.inputs.skip_smoke_test }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            infrastructure/caddy/Caddyfile "$USER@$HOST:/tmp/Caddyfile.incoming"

          {
            printf "SKIP_SMOKE=%q\n" "$SKIP_SMOKE"
            cat <<'REMOTE'
          set -euo pipefail

          STAMP=$(date +%Y%m%d-%H%M%S)
          LIVE=/etc/caddy/Caddyfile
          INCOMING=/tmp/Caddyfile.incoming
          BACKUP=/etc/caddy/Caddyfile.$STAMP

          # ---------------------------------------------------------------
          # Preflight. Every check below exists because it failed in
          # production on 2026-08-21 and cost an hour of a site being down.
          # All of it runs BEFORE the live file is touched.
          # ---------------------------------------------------------------

          # 1. Validate the incoming file where it lies. The previous version
          #    copied it over $LIVE first and validated in place, so a bad
          #    config was briefly live and a failure meant restoring from
          #    backup rather than never having changed anything.
          echo "🔍 validating incoming config"
          if ! sudo caddy validate --config "$INCOMING" --adapter caddyfile 2>&1 | tail -3; then
            echo "::error::Incoming config failed validation. Live config untouched."
            exit 1
          fi

          # 2. Every vhost must resolve. Caddy tries ACME for each named site
          #    on load; a name with no DNS record returns NXDOMAIN, certmagic
          #    retries on a 300s backoff, systemd's reload timeout fires
          #    mid-retry and kills the reload — which severs this very SSH
          #    session with exit 255, so the rollback below never runs.
          echo "🌐 checking DNS for every vhost"
          missing=""
          for host in $(grep -oE '^[a-z0-9][a-z0-9.-]*\.[a-z]{2,} \{' "$INCOMING" | sed 's/ {//'); do
            if [ -z "$(dig +short A "$host" @1.1.1.1)" ] && [ -z "$(dig +short AAAA "$host" @1.1.1.1)" ]; then
              missing="$missing $host"
            else
              echo "  ✅ $host"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These vhosts have no DNS record:$missing"
            echo "A vhost for a name that does not resolve stalls every future reload."
            echo "Add the DNS record first, or remove the block. Live config untouched."
            exit 1
          fi

          # 3. Pre-create every log file as caddy:caddy.
          #    "caddy validate" opens its log writers. Run under sudo, it
          #    CREATES any missing log file owned by root — and the caddy
          #    process, running as user caddy, then cannot open its own log.
          #    The reload fails with "permission denied" long after the
          #    validate that caused it appeared to succeed.
          echo "📝 ensuring log files are writable by caddy"
          for logfile in $(grep -oE 'output file [^ ]+' "$INCOMING" | awk '{print $3}'); do
            sudo mkdir -p "$(dirname "$logfile")"
            sudo touch "$logfile"
            sudo chown caddy:caddy "$logfile"
            sudo chown caddy:caddy "$(dirname "$logfile")"
            echo "  ✅ $logfile"
          done

          # 4. Refuse to start from a wedged state. A reload issued while the
          #    service is already stuck "reloading" just queues another
          #    timeout.
          state=$(systemctl is-active caddy || true)
          if [ "$state" = "reloading" ]; then
            echo "::error::caddy is stuck in 'reloading' from a previous attempt."
            echo "Run: sudo systemctl restart caddy   then re-dispatch."
            exit 1
          fi
          echo "✅ preflight passed (service: $state)"

          # ---------------------------------------------------------------
          # Apply
          # ---------------------------------------------------------------
          echo "📋 backing up live config to $BACKUP"
          sudo cp "$LIVE" "$BACKUP"
          sudo cp "$INCOMING" "$LIVE"
          sudo chown root:root "$LIVE" && sudo chmod 644 "$LIVE"

          echo "🔄 reloading caddy"
          # Bounded, so a hang is a clean failure here rather than a killed
          # reload that takes this SSH session down with it.
          reload_rc=0
          sudo timeout 60 systemctl reload caddy || reload_rc=$?

          if [ "$reload_rc" -eq 124 ]; then
            # Timed out. The config passed validation and every name resolves,
            # so the new config is not the suspect — the service is. Restart
            # rather than rolling back correct work.
            echo "⚠️  reload timed out; restarting caddy instead of reverting"
            sudo systemctl restart caddy || true
            sleep 5
          elif [ "$reload_rc" -ne 0 ]; then
            echo "::error::Reload failed (rc=$reload_rc) — restoring previous config"
            sudo cp "$BACKUP" "$LIVE"
            sudo timeout 60 systemctl reload caddy || sudo systemctl restart caddy
            exit 1
          fi

          if [ "$SKIP_SMOKE" = "true" ]; then
            echo "⚠️  smoke test skipped by request"
            exit 0
          fi

          # A config can be valid, reload cleanly, and still serve nothing.
          echo "🧪 smoke testing https://greenfieldoverride.com"
          ok=false
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://greenfieldoverride.com || echo 000)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 2
          done

          if [ "$ok" != "true" ]; then
            echo "::error::Site did not return 200 after reload (last: $code) — rolling back"
            sudo cp "$BACKUP" "$LIVE"
            sudo timeout 60 systemctl reload caddy || sudo systemctl restart caddy
            exit 1
          fi

          echo "✅ caddy reloaded and greenfieldoverride.com returns 200"
          echo "   previous config retained at $BACKUP"

          ls -1t /etc/caddy/Caddyfile.20* 2>/dev/null | tail -n +6 | sudo xargs -r rm -f
          REMOTE
          } | ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" "bash -s"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            echo "✅ Caddy config deployed and verified"
            echo "   Remember: the live file is now in sync with"
            echo "   infrastructure/caddy/Caddyfile — keep it that way."
          else
            echo "💥 Deploy failed. The previous config was restored automatically."
            echo "   Check https://greenfieldoverride.com before doing anything else."
          fi
