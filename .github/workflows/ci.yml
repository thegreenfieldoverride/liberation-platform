name: 🧪 CI - Test Pull Requests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: greenfieldoverride/liberation-platform

jobs:
  # Which parts of the repo did this PR actually touch?
  #
  # Deliberately a job gate, not a `paths:` filter on the trigger. With
  # `paths:`, a filtered PR never starts the workflow, so the required
  # "✅ CI Success" check never reports and the PR is BLOCKED forever. That
  # exact failure kept every PR in liberation-analytics unmergeable.
  #
  # Plain shell rather than a third-party action: one less dependency, and
  # nothing whose major version can move under us.
  changes:
    name: 🔍 Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      docker: ${{ steps.filter.outputs.docker }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE_REF"
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$FILES" | sed 's/^/  /'
          echo ""

          match() { echo "$FILES" | grep -qE "$1"; }

          # Application code: anything that could change what ships.
          if match '^(apps|packages)/|^package\.json$|^pnpm-(lock\.yaml|workspace\.yaml)$|^tsconfig|^playwright\.config'; then
            app=true; else app=false; fi

          # Docker build: app code, or the image definition itself.
          if match '^(apps|packages)/|^infrastructure/docker/|^Dockerfile|^\.dockerignore$|^pnpm-lock\.yaml$'; then
            docker=true; else docker=false; fi

          # Dependency audit only matters when dependencies move.
          if match '^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^(apps|packages)/[^/]+/package\.json$'; then
            deps=true; else deps=false; fi

          echo "app=$app"    | tee -a "$GITHUB_OUTPUT"
          echo "docker=$docker" | tee -a "$GITHUB_OUTPUT"
          echo "deps=$deps"  | tee -a "$GITHUB_OUTPUT"

  # Test code quality and functionality  
  test:
    name: 🧪 Test & Validate
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.18.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint || echo "⚠️ Linting skipped - no lint script found"

      - name: Run type checking
        run: pnpm run build

      - name: Run tests
        run: pnpm run test || echo "⚠️ Tests skipped - no test script found"

      # Production dependencies only, critical only. Dev tooling (eslint,
      # rollup, vitest, ladle) accounts for more than half the advisory count
      # and never ships. A gate that can never go green gets bypassed within a
      # week, so this is set where it can actually be held and tightened as
      # debt clears.
      - name: Security audit (production deps, critical)
        run: pnpm audit --prod --audit-level critical

  # Test Docker build
  docker-build:
    name: 🐳 Test Docker Build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Docker build
        run: |
          echo "🐳 Testing Docker build..."
          docker build -t liberation-platform:pr-test \
            -f infrastructure/docker/images/platform.Dockerfile \
            --build-arg DEPLOYMENT_TARGET=docker \
            --build-arg ENVIRONMENT=test \
            .

      - name: Test container startup
        run: |
          echo "🧪 Testing container startup..."
          # Start container in background
          docker run -d \
            --name liberation-test \
            -p 3333:3000 \
            -e NODE_ENV=production \
            -e ENVIRONMENT=test \
            liberation-platform:pr-test
          
          # Wait for startup
          sleep 15
          
          # Test health endpoint
          if curl -f -s http://localhost:3333/api/health; then
            echo "✅ Container health check passed"
          else
            echo "❌ Container health check failed"
            docker logs liberation-test
            exit 1
          fi
          
          # Cleanup
          docker stop liberation-test
          docker rm liberation-test

  # Check for security vulnerabilities
  security:
    name: 🔒 Security Checks
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          echo "🔒 Auditing production dependencies for critical advisories..."
          pnpm audit --prod --audit-level critical
          echo "✅ No critical advisories in shipped dependencies"

      # Advisory only — dev tooling and high-severity issues are reported so
      # the number stays visible, but they do not block the merge.
      - name: Full advisory report (non-blocking)
        run: pnpm audit --audit-level moderate || true

  # Auto-deploy to staging for Dependabot PRs (after tests pass)
  auto-deploy-staging:
    name: 🚀 Auto-Deploy to Staging
    needs: [test, docker-build, security]
    runs-on: ubuntu-latest
    if: >
      github.actor == 'dependabot[bot]' && 
      (contains(github.event.pull_request.title, 'security') || 
       contains(github.event.pull_request.title, 'patch'))
    environment:
      name: staging-pr
      url: https://staging.greenfieldoverride.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging for testing
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh $USER@$HOST << 'EOF'
            set -e
            
            echo "🚀 Auto-deploying Dependabot PR to staging..."
            
            # Deploy to staging environment
            cd /opt/liberation-platform || exit 1
            
            # Fetch the PR branch
            git fetch origin pull/${{ github.event.number }}/head:pr-${{ github.event.number }}
            git checkout pr-${{ github.event.number }}
            
            # Build and deploy to staging
            docker build -t liberation-platform:pr-${{ github.event.number }} \
              -f infrastructure/docker/images/platform.Dockerfile .
            
            # Stop current staging
            docker stop liberation-platform-staging || true
            docker rm liberation-platform-staging || true
            
            # Start new staging with PR changes
            docker run -d \
              --name liberation-platform-staging \
              --restart unless-stopped \
              -p 3001:3000 \
              -e NODE_ENV=production \
              -e ENVIRONMENT=staging \
              liberation-platform:pr-${{ github.event.number }}
            
            echo "✅ Dependabot PR deployed to staging"
          EOF

      - name: Test staging deployment
        run: |
          echo "🧪 Testing staging deployment..."
          sleep 30
          
          if curl -f -s http://${{ secrets.HETZNER_HOST }}:3001/api/health; then
            echo "✅ Staging deployment successful - Dependabot PR is safe"
          else
            echo "❌ Staging deployment failed"
            exit 1
          fi

  # Summary check (required status check)
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [changes, test, docker-build, security]
    if: always()
    env:
      TEST: ${{ needs.test.result }}
      DOCKER: ${{ needs.docker-build.result }}
      SECURITY: ${{ needs.security.result }}
      DETECT: ${{ needs.changes.result }}
    steps:
      - name: Check CI results
        run: |
          # "skipped" is a pass: the job was gated off because the PR does not
          # touch what it tests. Only "success" and "skipped" are acceptable —
          # failure, cancelled and anything else are not.
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }

          echo "detect:   $DETECT"
          echo "test:     $TEST"
          echo "docker:   $DOCKER"
          echo "security: $SECURITY"
          echo ""

          # The detector itself must always run: if it failed we do not know
          # what was skipped or why, so we cannot call this a pass.
          if [ "$DETECT" != "success" ]; then
            echo "::error::Change detection did not succeed — refusing to pass"
            exit 1
          fi

          if ok "$TEST" && ok "$DOCKER" && ok "$SECURITY"; then
            echo "✅ CI passed (skipped jobs were not applicable to this change)"
          else
            echo "::error::One or more required checks failed"
            exit 1
          fi